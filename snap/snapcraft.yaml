name: tempest
version: '2026.1'
adopt-info: tempest
summary: OpenStack Integration Test Suite
description: |
  Tempest is a set of integration tests to be run against a live
  OpenStack cluster. Tempest has batteries of tests for OpenStack
  API validation, Scenarios, and other specific tests useful in
  validating an OpenStack deployment.
license: Apache-2.0
confinement: strict
base: core26
apps:
  tempest:
    command: bin/tempest
    command-chain:
    - bin/tempest-wrapper
    completer: usr/share/bash-completion/completions/tempest
    plugs:
    - network-observe
    - network
    - home
    environment:
      TESTS: $SNAP_DATA/tempest_test_lists
      PYTHONPATH: $SNAP/lib/python3.14/site-packages
  discover:
    command: bin/discover-tempest-config
    environment:
      SSL_CERT_FILE: $OS_CACERT
      PYTHONPATH: $SNAP/lib/python3.14/site-packages
    plugs:
    - home
    - network
parts:
  wrapper:
    plugin: dump
    source: ./snap/local
    source-type: local
    organize:
      tempest-wrapper: bin/tempest-wrapper
  tempest:
    plugin: python
    source: https://opendev.org/openstack/tempest.git
    source-type: git
    # 'source-tag' and 'python-packages' are automatically generated and managed by
    # tools/update_snapcraft.py, and therefore, should not be manually modified.
    source-tag: 47.0.0
    python-packages:
    - git+https://opendev.org/openstack/barbican-tempest-plugin.git@4.5.0
    - git+https://opendev.org/openstack/cinder-tempest-plugin.git@1.22.0
    - git+https://opendev.org/openstack/designate-tempest-plugin.git@0.30.0
    - git+https://opendev.org/openstack/glance-tempest-plugin.git@0.16.0
    - git+https://opendev.org/openstack/heat-tempest-plugin.git@3.0.0
    - git+https://opendev.org/openstack/ironic-tempest-plugin.git@3.2.0
    - git+https://opendev.org/openstack/keystone-tempest-plugin.git@0.21.0
    - git+https://opendev.org/openstack/magnum-tempest-plugin.git@2.12.0
    - git+https://opendev.org/openstack/manila-tempest-plugin.git@3.2.0
    - git+https://opendev.org/openstack/neutron-tempest-plugin.git@3.3.0
    - git+https://opendev.org/openstack/octavia-tempest-plugin.git@3.5.0
    - git+https://opendev.org/openstack/telemetry-tempest-plugin.git@2.11.0
    - git+https://opendev.org/openinfra/python-tempestconf.git@3.5.4
    build-packages:
    - libssl-dev
    - libffi-dev
    - libxml2-dev
    - libxslt1-dev
    - libpq-dev
    - librdkafka-dev
    - rustc
    - cargo
    - pkg-config
    - git
    # Workaround: the python plugin does not yet know the interpreter for core26 (python3.14).
    # Manually create a venv and install packages, reading python-packages from this file so
    # snap-tempest-automation can continue to update them as before. see
    # https://github.com/canonical/snapcraft/issues/6411
    override-build: |
      python3 -m venv ${CRAFT_PART_INSTALL}
      ${CRAFT_PART_INSTALL}/bin/pip install ${CRAFT_PART_SRC}
      ${CRAFT_PART_INSTALL}/bin/python3 << PYEOF
      import yaml, subprocess, sys
      pip = sys.prefix + "/bin/pip"
      with open("${CRAFT_PROJECT_DIR}/snap/snapcraft.yaml") as f:
          data = yaml.safe_load(f)
      for pkg in data["parts"]["tempest"].get("python-packages", []):
          subprocess.check_call([pip, "install", pkg])
      PYEOF
      # Fix shebangs to use env python3 so they work at snap runtime
      find ${CRAFT_PART_INSTALL}/bin -maxdepth 1 -type f -exec sed -i '1s|^#!.*python.*|#!/usr/bin/env python3|' {} +
    override-prime: |
      craftctl default
      # Remove dangling venv symlinks pointing into the build directory.
      rm -f $CRAFT_PRIME/bin/python
      rm -f $CRAFT_PRIME/bin/python3
      rm -f $CRAFT_PRIME/bin/python3.14
      craftctl set version="$(PYTHONPATH=$CRAFT_PRIME/lib/python3.14/site-packages python3 -c "from importlib.metadata import version; print(version('tempest'))")"
      mkdir -p usr/share/bash-completion/completions
      PYTHONPATH=$CRAFT_PRIME/lib/python3.14/site-packages $CRAFT_PRIME/bin/tempest complete > usr/share/bash-completion/completions/tempest
      echo "complete -F _tempest tempest.tempest" >> usr/share/bash-completion/completions/tempest
